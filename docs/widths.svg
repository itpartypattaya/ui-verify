<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 620">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&amp;display=swap');
    text { font-family: 'JetBrains Mono', 'SF Mono', 'Cascadia Code', Consolas, monospace; }
    .t { fill: #ffffff; font-size: 13px; font-weight: 600; }
    .s { fill: #94a3b8; font-size: 10.5px; }
    .n { fill: #cbd5e1; font-size: 10.5px; }
    .h { fill: #e2e8f0; font-size: 12px; font-weight: 600; }
  </style>
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.5"/>
    </pattern>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="rgba(136,19,55,0.35)"/>
      <line x1="0" y1="0" x2="0" y2="8" stroke="#fb7185" stroke-width="2"/>
    </pattern>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#64748b"/>
    </marker>
  </defs>
  <rect width="100%" height="100%" fill="#0f172a"/>
  <rect width="100%" height="100%" fill="url(#grid)"/>

  <text x="30" y="40" fill="#ffffff" font-size="18" font-weight="700">widths.js — every width that matters, edges exact to the pixel</text>
  <text x="30" y="60" class="s">one hidden same-origin iframe, resized step by step; results from the test fixture</text>

  <!-- step 1: breakpoints -->
  <text x="30" y="92" class="h">1 · read the page's own breakpoints from its CSS</text>
  <rect x="30" y="102" width="470" height="64" rx="6" fill="#0f172a"/>
  <rect x="30" y="102" width="470" height="64" rx="6" fill="rgba(30,41,59,0.5)" stroke="#94a3b8" stroke-width="1"/>
  <text x="44" y="122" class="n">@media (min-width: 1024px) and (max-width: 1039px)</text>
  <text x="44" y="140" class="n">@media (min-width: 1040px)</text>
  <text x="44" y="158" class="n">@media (max-width: 500px)</text>
  <line x1="510" y1="134" x2="548" y2="134" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <g>
    <rect x="556" y="120" width="52" height="28" rx="14" fill="rgba(8,51,68,0.4)" stroke="#22d3ee"/>
    <text x="582" y="138" fill="#22d3ee" font-size="11" font-weight="600" text-anchor="middle">500</text>
    <rect x="616" y="120" width="60" height="28" rx="14" fill="rgba(8,51,68,0.4)" stroke="#22d3ee"/>
    <text x="646" y="138" fill="#22d3ee" font-size="11" font-weight="600" text-anchor="middle">1024</text>
    <rect x="684" y="120" width="60" height="28" rx="14" fill="rgba(8,51,68,0.4)" stroke="#22d3ee"/>
    <text x="714" y="138" fill="#22d3ee" font-size="11" font-weight="600" text-anchor="middle">1039</text>
    <rect x="752" y="120" width="60" height="28" rx="14" fill="rgba(8,51,68,0.4)" stroke="#22d3ee"/>
    <text x="782" y="138" fill="#22d3ee" font-size="11" font-weight="600" text-anchor="middle">1040</text>
  </g>
  <text x="556" y="166" class="s">each tested at bp−1, bp, bp+1 + 10 device widths</text>

  <!-- step 2: ruler 320..1920 → x 60..900 -->
  <text x="30" y="204" class="h">2 · sweep, then bisect every pass/fail boundary</text>

  <!-- bisect callout -->
  <rect x="300" y="216" width="600" height="44" rx="6" fill="#0f172a"/>
  <rect x="300" y="216" width="600" height="44" rx="6" fill="rgba(59,130,246,0.18)" stroke="#60a5fa" stroke-width="1"/>
  <text x="314" y="234" fill="#60a5fa" font-size="10.5" font-weight="600">bisect 501 ✗ … 768 ✓</text>
  <text x="314" y="250" class="n">634 ✗  701 ✓  667 ✗  684 ✓  675 ✗  679 ✗  681 ✗  682 ✓  → edge 681 | 682</text>
  <path d="M300 250 H262 V292" fill="none" stroke="#60a5fa" stroke-width="1" stroke-dasharray="3,3"/>

  <!-- axis -->
  <line x1="60" y1="300" x2="900" y2="300" stroke="#475569" stroke-width="2"/>
  <rect x="60" y="292" width="189.5" height="16" fill="rgba(136,19,55,0.55)" stroke="#fb7185" stroke-width="1"/>
  <rect x="429.6" y="292" width="8" height="16" fill="rgba(136,19,55,0.55)" stroke="#fb7185" stroke-width="1"/>
  <!-- device widths -->
  <g fill="#94a3b8">
    <circle cx="60" cy="300" r="3.5"/><circle cx="81" cy="300" r="3.5"/><circle cx="88.9" cy="300" r="3.5"/>
    <circle cx="96.8" cy="300" r="3.5"/><circle cx="109.4" cy="300" r="3.5"/><circle cx="295.2" cy="300" r="3.5"/>
    <circle cx="564" cy="300" r="3.5"/><circle cx="648" cy="300" r="3.5"/><circle cx="900" cy="300" r="3.5"/>
  </g>
  <!-- breakpoint edges -->
  <g fill="#22d3ee">
    <circle cx="154" cy="300" r="3"/><circle cx="154.5" cy="300" r="3"/><circle cx="155" cy="300" r="3"/>
    <circle cx="429" cy="300" r="3"/><circle cx="437.5" cy="300" r="3"/><circle cx="438.5" cy="300" r="3"/>
  </g>
  <!-- bisection probes -->
  <g fill="#60a5fa">
    <circle cx="224.9" cy="300" r="2.5"/><circle cx="260" cy="300" r="2.5"/><circle cx="242.2" cy="300" r="2.5"/>
    <circle cx="251.1" cy="300" r="2.5"/><circle cx="246.4" cy="300" r="2.5"/>
  </g>
  <g class="s" text-anchor="middle">
    <text x="60" y="326">320</text>
    <text x="249.5" y="326" fill="#fb7185">681</text>
    <text x="295.2" y="326">768</text>
    <text x="433" y="326" fill="#fb7185">1024–1039</text>
    <text x="564" y="326">1280</text>
    <text x="648" y="326">1440</text>
    <text x="900" y="326">1920</text>
  </g>
  <g class="s">
    <circle cx="520" cy="200" r="3.5" fill="#94a3b8"/><text x="528" y="204">device width</text>
    <circle cx="620" cy="200" r="3" fill="#22d3ee"/><text x="628" y="204">breakpoint edge</text>
    <circle cx="740" cy="200" r="2.5" fill="#60a5fa"/><text x="748" y="204">bisect probe</text>
    <rect x="836" y="195" width="12" height="10" fill="rgba(136,19,55,0.55)" stroke="#fb7185"/><text x="854" y="204">overflow</text>
  </g>

  <!-- zoom guides -->
  <line x1="429.6" y1="308" x2="140" y2="380" stroke="#475569" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="437.6" y1="308" x2="820" y2="380" stroke="#475569" stroke-width="1" stroke-dasharray="3,3"/>

  <!-- step 3: the gap -->
  <rect x="30" y="380" width="900" height="150" rx="12" fill="none" stroke="#fbbf24" stroke-width="1" stroke-dasharray="8,4"/>
  <text x="44" y="400" fill="#fbbf24" font-size="11" font-weight="600">3 · zoom 1036–1043px: the fractional-zoom gap (reported as gaps: ["1039px/1040px"])</text>

  <!-- inner axis 1036..1043 → 140..820, 97.14 px per CSS px -->
  <rect x="140" y="420" width="291.4" height="22" rx="3" fill="rgba(8,51,68,0.5)" stroke="#22d3ee"/>
  <text x="150" y="435" fill="#22d3ee" font-size="10.5" font-weight="600">max-width: 1039px</text>
  <rect x="528.6" y="420" width="291.4" height="22" rx="3" fill="rgba(6,78,59,0.5)" stroke="#34d399"/>
  <text x="538" y="435" fill="#34d399" font-size="10.5" font-weight="600">min-width: 1040px</text>
  <rect x="431.4" y="420" width="97.2" height="22" fill="url(#hatch)" stroke="#fb7185"/>

  <line x1="140" y1="456" x2="820" y2="456" stroke="#475569" stroke-width="1.5"/>
  <g stroke="#64748b" stroke-width="1">
    <line x1="140" y1="451" x2="140" y2="461"/><line x1="237.1" y1="451" x2="237.1" y2="461"/>
    <line x1="334.3" y1="451" x2="334.3" y2="461"/><line x1="431.4" y1="451" x2="431.4" y2="461"/>
    <line x1="528.6" y1="451" x2="528.6" y2="461"/><line x1="625.7" y1="451" x2="625.7" y2="461"/>
    <line x1="722.9" y1="451" x2="722.9" y2="461"/><line x1="820" y1="451" x2="820" y2="461"/>
  </g>
  <g class="s" text-anchor="middle">
    <text x="140" y="474">1036</text><text x="237.1" y="474">1037</text><text x="334.3" y="474">1038</text>
    <text x="431.4" y="474">1039</text><text x="528.6" y="474">1040</text><text x="625.7" y="474">1041</text>
    <text x="722.9" y="474">1042</text><text x="820" y="474">1043</text>
  </g>
  <polygon points="450.9,448 445,438 456.8,438" fill="#fbbf24"/>
  <text x="458" y="494" fill="#fb7185" font-size="10.5" font-weight="600">1039.01–1039.99: no rule applies</text>
  <text x="44" y="514" class="n">a 1039px frame at 125 % zoom is 1039.2 CSS px wide (▲) — falls into the gap · fix: max-width: 1039.98px  or  width &lt; 1040px</text>

  <!-- output -->
  <rect x="30" y="548" width="900" height="44" rx="6" fill="#0f172a"/>
  <rect x="30" y="548" width="900" height="44" rx="6" fill="rgba(6,78,59,0.3)" stroke="#34d399" stroke-width="1"/>
  <text x="44" y="567" fill="#34d399" font-size="11" font-weight="600">result</text>
  <text x="44" y="583" class="n">failingRanges: ["≤320–681", "1024–1039"] at 100 % zoom — "1024–1038" at 125 % · gaps: ["1039px/1040px"]</text>
</svg>
