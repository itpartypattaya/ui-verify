<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 800">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&amp;display=swap');
    text { font-family: 'JetBrains Mono', 'SF Mono', 'Cascadia Code', Consolas, monospace; }
    .t { fill: #ffffff; font-size: 13px; font-weight: 600; }
    .s { fill: #94a3b8; font-size: 10.5px; }
    .l { font-size: 10.5px; font-weight: 600; }
  </style>
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.5"/>
    </pattern>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#64748b"/>
    </marker>
    <marker id="arrow-rose" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#fb7185"/>
    </marker>
    <marker id="arrow-blue" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#60a5fa"/>
    </marker>
  </defs>
  <rect width="100%" height="100%" fill="#0f172a"/>
  <rect width="100%" height="100%" fill="url(#grid)"/>

  <!-- title -->
  <text x="30" y="40" fill="#ffffff" font-size="18" font-weight="700">ui-verify — measure first, conclude second</text>
  <text x="30" y="60" class="s">every check answers ok: true · ok: false · ok: null — never a made-up number</text>

  <!-- connectors -->
  <line x1="480" y1="140" x2="480" y2="168" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="480" y1="232" x2="480" y2="260" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="550" y1="300" x2="678" y2="300" stroke="#fb7185" stroke-width="1.5" marker-end="url(#arrow-rose)"/>
  <text x="566" y="292" fill="#fb7185" class="l">No</text>
  <path d="M800 270 V201 H652" fill="none" stroke="#fb7185" stroke-width="1.5" stroke-dasharray="5,4" marker-end="url(#arrow-rose)"/>
  <text x="712" y="194" fill="#fb7185" font-size="10">re-check</text>
  <line x1="480" y1="338" x2="480" y2="378" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="490" y="362" fill="#34d399" class="l">Yes</text>
  <line x1="282" y1="411" x2="328" y2="411" stroke="#22d3ee" stroke-width="1" stroke-dasharray="3,3"/>
  <!-- fan-out to three results -->
  <path d="M480 442 V480" fill="none" stroke="#64748b" stroke-width="1.5"/>
  <path d="M190 480 H770" fill="none" stroke="#64748b" stroke-width="1.5"/>
  <line x1="190" y1="480" x2="190" y2="518" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="480" y1="480" x2="480" y2="518" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="770" y1="480" x2="770" y2="518" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <!-- results to actions -->
  <line x1="190" y1="590" x2="190" y2="628" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="480" y1="590" x2="480" y2="628" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="770" y1="590" x2="770" y2="628" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <!-- re-run loop -->
  <path d="M480 692 V722 H942 V411 H634" fill="none" stroke="#60a5fa" stroke-width="1.5" stroke-dasharray="6,4" marker-end="url(#arrow-blue)"/>
  <path d="M770 692 V722" fill="none" stroke="#60a5fa" stroke-width="1.5" stroke-dasharray="6,4"/>
  <text x="790" y="740" fill="#60a5fa" font-size="10">re-run the same check</text>

  <!-- start -->
  <rect x="290" y="90" width="380" height="50" rx="25" fill="#0f172a"/>
  <rect x="290" y="90" width="380" height="50" rx="25" fill="rgba(59,130,246,0.3)" stroke="#60a5fa" stroke-width="1.5"/>
  <text x="480" y="112" class="t" text-anchor="middle">"it moved" · "looks pale" · "no effect"</text>
  <text x="480" y="128" class="s" text-anchor="middle">a complaint, a screenshot, or your own doubt</text>

  <!-- settle -->
  <rect x="300" y="170" width="360" height="62" rx="6" fill="#0f172a"/>
  <rect x="300" y="170" width="360" height="62" rx="6" fill="rgba(8,51,68,0.4)" stroke="#22d3ee" stroke-width="1.5"/>
  <text x="480" y="195" class="t" text-anchor="middle">settle.js — the gate</text>
  <text x="480" y="213" class="s" text-anchor="middle">viewport ≠ 0 · loaded · fonts · images · transitions done</text>

  <!-- decision -->
  <g transform="translate(480, 300)">
    <polygon points="0,-38 70,0 0,38 -70,0" fill="#0f172a"/>
    <polygon points="0,-38 70,0 0,38 -70,0" fill="rgba(120,53,15,0.3)" stroke="#fbbf24" stroke-width="1.5"/>
    <text y="5" class="t" text-anchor="middle">ready?</text>
  </g>

  <!-- blockers -->
  <rect x="680" y="270" width="250" height="60" rx="6" fill="#0f172a"/>
  <rect x="680" y="270" width="250" height="60" rx="6" fill="rgba(136,19,55,0.4)" stroke="#fb7185" stroke-width="1.5"/>
  <text x="805" y="294" class="t" text-anchor="middle">Fix the blockers</text>
  <text x="805" y="312" class="s" text-anchor="middle">set a real viewport · wait it out</text>

  <!-- library -->
  <rect x="30" y="330" width="252" height="132" rx="8" fill="none" stroke="#22d3ee" stroke-width="1" stroke-dasharray="8,4"/>
  <text x="44" y="350" fill="#22d3ee" font-size="11" font-weight="600">checks/  — pick by complaint</text>
  <g class="s" font-size="10.5">
    <text x="44" y="372" class="s">overflow · widths</text>
    <text x="44" y="390" class="s">contrast · grid</text>
    <text x="44" y="408" class="s">rules · theme</text>
    <text x="44" y="426" class="s">glyphs · visible</text>
    <text x="44" y="444" class="s">clipped · images · mobile</text>
  </g>

  <!-- run -->
  <rect x="330" y="380" width="300" height="62" rx="6" fill="#0f172a"/>
  <rect x="330" y="380" width="300" height="62" rx="6" fill="rgba(8,51,68,0.4)" stroke="#22d3ee" stroke-width="1.5"/>
  <text x="480" y="405" class="t" text-anchor="middle">Run the matching check</text>
  <text x="480" y="423" class="s" text-anchor="middle">one function in the browser → JSON</text>

  <!-- note -->
  <rect x="30" y="160" width="250" height="78" rx="6" fill="#0f172a"/>
  <rect x="30" y="160" width="250" height="78" rx="6" fill="rgba(30,41,59,0.5)" stroke="#94a3b8" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="44" y="181" fill="#e2e8f0" font-size="11" font-weight="600">A screenshot is not a ruler</text>
  <text x="44" y="199" class="s">use it for composition only;</text>
  <text x="44" y="215" class="s">colour, size, "did it apply"</text>
  <text x="44" y="231" class="s">are decided by numbers</text>

  <!-- results -->
  <rect x="60" y="520" width="260" height="70" rx="6" fill="#0f172a"/>
  <rect x="60" y="520" width="260" height="70" rx="6" fill="rgba(6,78,59,0.4)" stroke="#34d399" stroke-width="1.5"/>
  <text x="190" y="548" class="t" text-anchor="middle">ok: true</text>
  <text x="190" y="568" class="s" text-anchor="middle">pass — keep the numbers</text>

  <rect x="350" y="520" width="260" height="70" rx="6" fill="#0f172a"/>
  <rect x="350" y="520" width="260" height="70" rx="6" fill="rgba(136,19,55,0.4)" stroke="#fb7185" stroke-width="1.5"/>
  <text x="480" y="548" class="t" text-anchor="middle">ok: false</text>
  <text x="480" y="568" class="s" text-anchor="middle">real defect: element · size · cause</text>

  <rect x="640" y="520" width="260" height="70" rx="6" fill="#0f172a"/>
  <rect x="640" y="520" width="260" height="70" rx="6" fill="rgba(76,29,149,0.4)" stroke="#a78bfa" stroke-width="1.5"/>
  <text x="770" y="548" class="t" text-anchor="middle">ok: null</text>
  <text x="770" y="568" class="s" text-anchor="middle">can't tell — and says why</text>

  <!-- actions -->
  <rect x="60" y="630" width="260" height="62" rx="25" fill="#0f172a"/>
  <rect x="60" y="630" width="260" height="62" rx="25" fill="rgba(59,130,246,0.3)" stroke="#60a5fa" stroke-width="1.5"/>
  <text x="190" y="656" class="t" text-anchor="middle">Report with numbers</text>
  <text x="190" y="674" class="s" text-anchor="middle">"3 cards 299×168, no overflow"</text>

  <rect x="350" y="630" width="260" height="62" rx="6" fill="#0f172a"/>
  <rect x="350" y="630" width="260" height="62" rx="6" fill="rgba(6,78,59,0.4)" stroke="#34d399" stroke-width="1.5"/>
  <text x="480" y="656" class="t" text-anchor="middle">Fix the cause</text>
  <text x="480" y="674" class="s" text-anchor="middle">references/fixes.md</text>

  <rect x="640" y="630" width="260" height="62" rx="6" fill="#0f172a"/>
  <rect x="640" y="630" width="260" height="62" rx="6" fill="rgba(76,29,149,0.4)" stroke="#a78bfa" stroke-width="1.5"/>
  <text x="770" y="656" class="t" text-anchor="middle">Change the channel</text>
  <text x="770" y="674" class="s" text-anchor="middle">scroll · viewport · pixels · zoom</text>

  <!-- legend -->
  <g transform="translate(30, 762)">
    <rect width="12" height="12" rx="2" fill="rgba(8,51,68,0.4)" stroke="#22d3ee"/>
    <text x="18" y="10" class="s">measure</text>
    <rect x="100" width="12" height="12" rx="2" fill="rgba(120,53,15,0.3)" stroke="#fbbf24"/>
    <text x="118" y="10" class="s">gate</text>
    <rect x="170" width="12" height="12" rx="2" fill="rgba(6,78,59,0.4)" stroke="#34d399"/>
    <text x="188" y="10" class="s">pass / fix</text>
    <rect x="280" width="12" height="12" rx="2" fill="rgba(136,19,55,0.4)" stroke="#fb7185"/>
    <text x="298" y="10" class="s">defect / blocker</text>
    <rect x="420" width="12" height="12" rx="2" fill="rgba(76,29,149,0.4)" stroke="#a78bfa"/>
    <text x="438" y="10" class="s">inconclusive</text>
  </g>
</svg>
