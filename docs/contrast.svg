<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&amp;display=swap');
    text { font-family: 'JetBrains Mono', 'SF Mono', 'Cascadia Code', Consolas, monospace; }
    .t { fill: #ffffff; font-size: 13px; font-weight: 600; }
    .s { fill: #94a3b8; font-size: 10.5px; }
    .n { fill: #cbd5e1; font-size: 10.5px; }
  </style>
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.5"/>
    </pattern>
    <pattern id="photo" width="24" height="24" patternUnits="userSpaceOnUse">
      <rect width="24" height="24" fill="#a3b18a"/>
      <rect width="12" height="12" fill="#e9d8a6"/>
      <rect x="12" y="12" width="12" height="12" fill="#588157"/>
    </pattern>
    <linearGradient id="panel" x1="0" x2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.14"/>
    </linearGradient>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#64748b"/>
    </marker>
    <marker id="arrow-cyan" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#22d3ee"/>
    </marker>
  </defs>
  <rect width="100%" height="100%" fill="#0f172a"/>
  <rect width="100%" height="100%" fill="url(#grid)"/>

  <text x="30" y="40" fill="#ffffff" font-size="18" font-weight="700">contrast.js — rebuild what is really under the text</text>
  <text x="30" y="60" class="s">#ddd text on a 14 % white panel over a #111 page — same element, two meters (test fixture #c-translucent)</text>

  <!-- ============ naive ============ -->
  <rect x="30" y="84" width="400" height="330" rx="12" fill="none" stroke="#fb7185" stroke-width="1" stroke-dasharray="8,4"/>
  <text x="44" y="104" fill="#fb7185" font-size="11" font-weight="600">naive meter: first non-transparent parent</text>

  <rect x="60" y="126" width="340" height="44" rx="6" fill="#0f172a"/>
  <rect x="60" y="126" width="340" height="44" rx="6" fill="rgba(30,41,59,0.5)" stroke="#94a3b8" stroke-width="1"/>
  <text x="76" y="153" fill="#dddddd" font-size="13" font-weight="600">Aa</text>
  <text x="110" y="153" class="n">text  color #ddd</text>

  <line x1="230" y1="170" x2="230" y2="194" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="240" y="187" class="s">parentElement</text>

  <rect x="60" y="196" width="340" height="44" rx="6" fill="#0f172a"/>
  <rect x="60" y="196" width="340" height="44" rx="6" fill="rgba(30,41,59,0.5)" stroke="#94a3b8" stroke-width="1"/>
  <rect x="72" y="206" width="24" height="24" rx="3" fill="#ececec" stroke="#64748b"/>
  <text x="110" y="216" class="n">panel  rgb(255 255 255 / .14)</text>
  <text x="110" y="232" class="s">alpha dropped → taken as white</text>

  <rect x="60" y="256" width="340" height="44" rx="6" fill="none" stroke="#475569" stroke-width="1" stroke-dasharray="3,3"/>
  <text x="76" y="283" fill="#64748b" font-size="10.5">page  #111  — never reached</text>

  <rect x="60" y="322" width="340" height="70" rx="6" fill="#0f172a"/>
  <rect x="60" y="322" width="340" height="70" rx="6" fill="rgba(136,19,55,0.4)" stroke="#fb7185" stroke-width="1.5"/>
  <text x="230" y="352" fill="#fb7185" font-size="20" font-weight="700" text-anchor="middle">1.36 : 1  ✗</text>
  <text x="230" y="375" class="s" text-anchor="middle">invented defect — someone "fixes" working CSS</text>

  <!-- ============ ui-verify ============ -->
  <rect x="470" y="84" width="460" height="330" rx="12" fill="none" stroke="#22d3ee" stroke-width="1" stroke-dasharray="8,4"/>
  <text x="484" y="104" fill="#22d3ee" font-size="11" font-weight="600">ui-verify: hit-test the text, composite every layer</text>

  <!-- probe line through the stack -->
  <line x1="560" y1="122" x2="560" y2="300" stroke="#22d3ee" stroke-width="1.5" stroke-dasharray="2,3"/>
  <circle cx="560" cy="122" r="4" fill="#22d3ee"/>
  <text x="572" y="126" fill="#22d3ee" font-size="10">elementsFromPoint(x, y)</text>

  <!-- layers as slanted sheets -->
  <g>
    <polygon points="520,140 760,140 730,176 490,176" fill="#0f172a"/>
    <polygon points="520,140 760,140 730,176 490,176" fill="rgba(30,41,59,0.6)" stroke="#94a3b8" stroke-width="1"/>
    <text x="536" y="164" fill="#dddddd" font-size="13" font-weight="600">Aa</text>
    <text x="772" y="156" class="n">text #ddd</text>
    <text x="772" y="170" class="s">fg alpha × opacity</text>

    <polygon points="520,196 760,196 730,232 490,232" fill="#0f172a"/>
    <polygon points="520,196 760,196 730,232 490,232" fill="url(#panel)" stroke="#e2e8f0" stroke-width="1"/>
    <text x="772" y="212" class="n">panel, alpha .14</text>
    <text x="772" y="226" class="s">composited, not copied</text>

    <polygon points="520,252 760,252 730,288 490,288" fill="#111111" stroke="#34d399" stroke-width="1.5"/>
    <text x="772" y="268" class="n">page #111</text>
    <text x="772" y="282" fill="#34d399" font-size="10.5">opaque → stop here</text>
  </g>

  <line x1="610" y1="300" x2="610" y2="320" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="620" y="314" class="s">composite bottom-up</text>

  <rect x="490" y="322" width="420" height="70" rx="6" fill="#0f172a"/>
  <rect x="490" y="322" width="420" height="70" rx="6" fill="rgba(6,78,59,0.4)" stroke="#34d399" stroke-width="1.5"/>
  <rect x="506" y="338" width="38" height="38" rx="4" fill="#323232" stroke="#64748b"/>
  <text x="514" y="363" fill="#dddddd" font-size="13" font-weight="600">Aa</text>
  <text x="720" y="352" fill="#34d399" font-size="20" font-weight="700" text-anchor="middle">9.40 : 1  ✓</text>
  <text x="720" y="375" class="s" text-anchor="middle">gradients: worst colour, between stops too · any CSS colour</text>

  <!-- ============ bottom: what is under the text ============ -->
  <text x="30" y="452" fill="#e2e8f0" font-size="12" font-weight="600">what the base layer turns out to be</text>

  <rect x="30" y="466" width="280" height="120" rx="8" fill="#0f172a"/>
  <rect x="30" y="466" width="280" height="120" rx="8" fill="rgba(6,78,59,0.4)" stroke="#34d399" stroke-width="1.5"/>
  <rect x="46" y="482" width="40" height="40" rx="4" fill="#111111" stroke="#64748b"/>
  <text x="100" y="498" class="t">opaque colour</text>
  <text x="100" y="514" class="s">page, card, section</text>
  <text x="46" y="548" class="n">exact ratio → pass / fail</text>
  <text x="46" y="566" class="s">ok: true or ok: false</text>

  <rect x="340" y="466" width="280" height="120" rx="8" fill="#0f172a"/>
  <rect x="340" y="466" width="280" height="120" rx="8" fill="rgba(8,51,68,0.4)" stroke="#22d3ee" stroke-width="1.5"/>
  <rect x="356" y="482" width="40" height="40" rx="4" fill="url(#photo)" stroke="#64748b"/>
  <text x="410" y="498" class="t">&lt;img&gt; / &lt;video&gt;</text>
  <text x="410" y="514" class="s">same-origin or CORS</text>
  <text x="356" y="548" class="n">reads the pixels under every line</text>
  <text x="356" y="566" class="s">pass only if every pixel passes</text>

  <rect x="650" y="466" width="280" height="120" rx="8" fill="#0f172a"/>
  <rect x="650" y="466" width="280" height="120" rx="8" fill="rgba(76,29,149,0.4)" stroke="#a78bfa" stroke-width="1.5"/>
  <g transform="translate(666, 482)">
    <rect width="5" height="40" fill="#000000"/><rect x="5" width="5" height="40" fill="#202020"/>
    <rect x="10" width="5" height="40" fill="#404040"/><rect x="15" width="5" height="40" fill="#606060"/>
    <rect x="20" width="5" height="40" fill="#909090"/><rect x="25" width="5" height="40" fill="#b0b0b0"/>
    <rect x="30" width="5" height="40" fill="#d8d8d8"/><rect x="35" width="5" height="40" fill="#ffffff"/>
    <rect width="40" height="40" fill="none" stroke="#64748b"/>
  </g>
  <text x="720" y="498" class="t">pixels unknown</text>
  <text x="720" y="514" class="s">CSS bg image, cross-origin</text>
  <text x="666" y="548" class="n">exact bound over any colour</text>
  <text x="666" y="566" class="s">underneath: worst ok → pass, else null</text>

  <text x="30" y="616" class="s">thresholds WCAG 2: 4.5 : 1 text · 3 : 1 large text (≥ 24px, or ≥ 18.67px bold) · disabled controls exempt</text>
</svg>
